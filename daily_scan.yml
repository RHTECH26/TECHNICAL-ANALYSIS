name: Daily NSE range breakout scan

on:
  schedule:
    # 16:00 IST Mon-Fri = 10:30 UTC (after NSE close)
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan_results.json
          git diff --staged --quiet || git commit -m "Daily scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
