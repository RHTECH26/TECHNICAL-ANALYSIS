name: Update Global ETF CoT Scan

on:
  schedule:
    - cron: "30 1 * * 2-6"      # 7:00 AM IST, Tue-Sat (after the US close)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python scan_global_etf_cot.py
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/global_etf_cot.json
          git diff --staged --quiet || git commit -m "Update Global ETF CoT scan"
          git pull --rebase
          git push
