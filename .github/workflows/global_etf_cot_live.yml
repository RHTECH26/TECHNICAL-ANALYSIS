name: Update Global ETF CoT Scan (live)

on:
  schedule:
    - cron: "30 3 * * 1-5"       # 9:00 AM IST  - Asia session
    - cron: "15 8,11 * * 1-5"    # 1:45 PM and 4:45 PM IST - Europe session
    - cron: "45 14,19 * * 1-5"   # 8:15 PM and 1:15 AM IST - US open and US late session
    - cron: "15 17 * * 1-5"      # 10:45 PM IST - US mid session
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

# a new run waits for the previous one instead of running alongside it
concurrency:
  group: global-etf-cot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy openpyxl
      - run: python scan_global_etf_cot.py 1H 1D
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/global_etf_cot.json data/global_etf_cot_1H.json
          git diff --staged --quiet || git commit -m "Update Global ETF CoT Scan (live)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push attempt $attempt failed - retrying..."
            sleep 5
          done
