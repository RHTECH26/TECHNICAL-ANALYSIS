name: Update Price History (My Portfolio)

on:
  schedule:
    - cron: "45 11 * * 1-5"      # 5:15 PM IST, Mon-Fri, after the NSE close
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy openpyxl curl_cffi
      - run: python scan_history.py
      - name: Publish to the live-history branch (one commit that is replaced every run)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf .git
          git init -q -b live-history
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add cal.json h
          git commit -q -m "History $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" live-history
