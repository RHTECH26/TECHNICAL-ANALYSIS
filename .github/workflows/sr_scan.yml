name: Update S&R, Breakout and Reversal Screeners

on:
  schedule:
    - cron: "30 1 * * 2-6"      # 7:00 AM IST, Tue-Sat (after the Indian and US closes)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy openpyxl
      - name: Scan Indian stocks
        run: python scan_sr.py stocks
      - name: Scan Global ETFs
        if: always()
        run: python scan_sr.py etf
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/sr_*.json data/bo_*.json data/rv_*.json || true
          git diff --staged --quiet || git commit -m "Update S&R, breakout and reversal screeners"
          git pull --rebase
          git push
