name: Update Dow Trend Change Scan (1 hour)

on:
  schedule:
    - cron: "15 5,7,9,10 * * 1-5"   # 10:45, 12:45, 14:45 and 15:45 IST, Mon-Fri (during and just after the NSE session)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

# a new run waits for the previous 1-hour run instead of running alongside it
concurrency:
  group: dow-trend-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy openpyxl
      - run: python scan_dow_trend.py 1H
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/dow_trend_1H.json
          git diff --staged --quiet || git commit -m "Update Dow Trend Change Scan (1 hour)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push attempt $attempt failed - retrying..."
            sleep 5
          done
