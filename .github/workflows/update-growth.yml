name: Update growth data

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST, Monday to Friday (after the market close)
  workflow_dispatch:           # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: growth-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pandas tradingview-screener yfinance

      - name: Build data/growth.json
        run: python fetch_growth.py

      - name: Commit the new data
        run: |
          git config user.name  "growth-bot"
          git config user.email "growth-bot@users.noreply.github.com"
          git add data/growth.json data/yahoo_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update growth data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
