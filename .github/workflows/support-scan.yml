name: Support Scan
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 PM IST, Mon-Fri
  workflow_dispatch:           # gives you a manual "Run workflow" button
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/support_requirements.txt
      - run: python scripts/support_scan.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/support.json
          git diff --staged --quiet || git commit -m "Update support scan $(date -u +%F)"
          git pull --rebase
          git push
