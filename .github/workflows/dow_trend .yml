name: Update Dow Trend Change Scan

on:
  schedule:
    - cron: "30 11 * * 1-5"     # 5:00 PM IST, Mon-Fri (after market close)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy openpyxl
      - run: python scan_dow_trend.py
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/dow_trend.json
          git diff --staged --quiet || git commit -m "Update Dow trend change scan"
          git pull --rebase
          git push
