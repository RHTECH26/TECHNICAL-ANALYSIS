name: Update Dow Trend Change Scan

on:
  schedule:
    - cron: "15 5,7,9 * * 1-5"   # 10:45 AM, 12:45 PM and 2:45 PM IST, Mon-Fri (during the NSE session)
    - cron: "30 11 * * 1-5"   # 5:00 PM IST, Mon-Fri (after the close, final numbers)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

# only one of these scans runs at a time; a newer one waits its turn
concurrency:
  group: dow-trend-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # a scan that takes longer than this is stuck, so it is stopped instead of blocking the next ones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy openpyxl
      - run: python scan_dow_trend.py 1D 1W 1M
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/keep
          cp -f data/dow_trend.json data/dow_trend_1W.json data/dow_trend_1M.json /tmp/keep/
          git add data/dow_trend.json data/dow_trend_1W.json data/dow_trend_1M.json
          git diff --staged --quiet || git commit -q -m "Update Dow Trend Change Scan (1D, 1W, 1M)"
          for attempt in 1 2 3 4 5; do
            git push && break
            echo "Push attempt $attempt failed - taking the latest main and re-applying the new data..."
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -f /tmp/keep/*.json data/
            git add data/dow_trend.json data/dow_trend_1W.json data/dow_trend_1M.json
            git diff --staged --quiet || git commit -q -m "Update Dow Trend Change Scan (1D, 1W, 1M)"
            sleep 5
          done
