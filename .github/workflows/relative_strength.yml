name: Update Relative Strength Data

on:
  schedule:
    - cron: "0 12 * * 1-5"      # 5:30 PM IST, Mon-Fri (after the NSE close)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy openpyxl
      - run: python scan_relative_strength.py
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/rs_stocks.json data/rs_benchmarks.json
          git diff --staged --quiet || git commit -m "Update Relative Strength data"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push attempt $attempt failed - retrying..."
            sleep 5
          done
