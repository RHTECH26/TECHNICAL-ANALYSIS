name: Update Model Portfolios

on:
  schedule:
    - cron: "0 13 * * 1-5"       # 6:30 PM IST, Mon-Fri (after the NSE close)
  workflow_dispatch:             # lets you run it manually from the Actions tab
    inputs:
      which:
        description: "What to build: all, or long, or short"
        default: "all"

permissions:
  contents: write

# only one run at a time; a newer one waits its turn
concurrency:
  group: model-portfolios
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # a run that takes longer than this is stuck, so it is stopped instead of blocking the next ones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Build the portfolios
        env:
          WHICH: ${{ github.event.inputs.which }}
        run: |
          if [ -n "$WHICH" ] && [ "$WHICH" != "all" ]; then LIST="$WHICH"; else LIST="long short"; fi
          echo "Building: $LIST"
          python model_portfolio.py $LIST
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/keep
          cp -f data/mp_long.json data/mp_short.json data/mp_backtest.json /tmp/keep/ 2>/dev/null || true
          git add data/mp_long.json 2>/dev/null || true
          git add data/mp_short.json 2>/dev/null || true
          git add data/mp_backtest.json 2>/dev/null || true
          git diff --staged --quiet || git commit -q -m "Update Model Portfolios"
          for attempt in 1 2 3 4 5; do
            git push && break
            echo "Push attempt $attempt failed - taking the latest main and re-applying the new data..."
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -f /tmp/keep/mp_*.json data/ 2>/dev/null || true
            git add data/mp_long.json 2>/dev/null || true
            git add data/mp_short.json 2>/dev/null || true
            git add data/mp_backtest.json 2>/dev/null || true
            git diff --staged --quiet || git commit -q -m "Update Model Portfolios"
            sleep 5
          done
