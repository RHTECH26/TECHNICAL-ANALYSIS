name: Update Model Portfolio

on:
  schedule:
    - cron: "0 13 * * 1-5"       # 6:30 PM IST, Mon-Fri (after the NSE close)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write

# only one run at a time; a newer one waits its turn
concurrency:
  group: model-portfolio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # a run that takes longer than this is stuck, so it is stopped instead of blocking the next ones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python model_portfolio.py
      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/keep
          cp -f data/model_portfolio.json /tmp/keep/
          git add data/model_portfolio.json
          git diff --staged --quiet || git commit -q -m "Update Model Portfolio"
          for attempt in 1 2 3 4 5; do
            git push && break
            echo "Push attempt $attempt failed - taking the latest main and re-applying the new data..."
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -f /tmp/keep/model_portfolio.json data/
            git add data/model_portfolio.json
            git diff --staged --quiet || git commit -q -m "Update Model Portfolio"
            sleep 5
          done
